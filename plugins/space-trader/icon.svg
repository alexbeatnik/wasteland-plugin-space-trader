<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none"
     stroke="#ffb000" stroke-width="1.8" stroke-linecap="square">
  <!-- A course plotted between two stars rather than a ship: the app tints icons
       through its own palette, so open strokes survive the filter better than a
       filled glyph, and a hull at 1.1rem is a blob. The dashed leg is what the
       game is actually about — the jump between two markets. -->
  <path d="M5 18 L19 6" stroke-dasharray="2.5 2.5" />
  <path d="M3 20h4v-4H3zM17 8h4V4h-4z" />
  <path d="M13 17l2 2M15 17l-2 2" />
</svg>
